name: Windows build and tests
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npx install-electron
      - run: npm test
      - name: Native Windows UI and preload smoke test
        run: npm run smoke
        timeout-minutes: 3
      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged executable and bundled installer
        run: |
          $process = Start-Process -FilePath './release/win-unpacked/SideAI.exe' -ArgumentList '--smoke-test' -Wait -PassThru -RedirectStandardOutput 'packaged-smoke.log' -RedirectStandardError 'packaged-smoke-error.log'
          Get-Content 'packaged-smoke.log'
          Get-Content 'packaged-smoke-error.log'
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (-not (Select-String -Path 'packaged-smoke.log' -Pattern '"smoke":"passed"' -Quiet)) { throw 'Missing packaged smoke result' }
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        with:
          name: SideAI-Windows-x64
          path: |
            windows/release/*.exe
            windows/release/*.zip
          if-no-files-found: error
          retention-days: 30

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SideAI</title><link rel="stylesheet" href="style.css"></head><body>
<header id="bar"><button id="home" title="选择 AI"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button><div class="drag"><b id="brand">SideAI</b><small id="subtitle">随时，接着想</small></div><button id="pin" title="固定窗口"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-1 6 4 4v2H5v-2l4-4-1-6Z"/><path d="M12 15v7"/></svg></button><button id="settings" title="设置与连接">⚙</button><button id="hide" title="收起，返回游戏">×</button></header>
<nav id="modes"><button data-mode="chat">聊天</button><button data-mode="agent">Agent</button><span></span><button id="history" title="会话列表">☷</button><button id="new">＋ 新会话</button></nav>
<div id="notice" role="status"></div>
<main id="homePage"><h1>选择 AI，进入你的空间</h1><p class="muted">你的连接，各自独立的会话。</p><div id="connections" class="grid"></div><button id="add" class="wide">＋ 添加 AI</button><p class="hint">收起后任务继续运行。需要确认时，托盘图标会提醒你。</p></main>
<main id="chatPage" hidden><div id="context"></div><section id="approvals" aria-label="等待确认的操作"></section><div id="timeline" aria-live="polite"></div><div id="empty"><h1>随时，接着想。</h1><p>当前连接有独立的历史、草稿与模型。</p></div></main>
<footer id="compose"><button id="memory" title="发送后自动参考历史；点击设置">记忆已开启</button><div id="draftImages"></div><textarea id="composer" aria-label="消息输入框" rows="3"></textarea><div class="composeActions"><button id="image" title="添加图片，也可拖入或粘贴"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg></button><span class="hint">Enter 发送 · Shift Enter 换行</span><button id="send" class="primary" title="发送">↑</button></div><div class="models"><input id="model" list="modelOptions" aria-label="选择或输入模型" placeholder="选择或输入模型"><datalist id="modelOptions"></datalist><select id="effort" aria-label="推理强度"><option value="">默认强度</option></select><button id="refreshModels" title="刷新模型列表">↻</button></div></footer>
<dialog id="dialog"><div class="dialogHeader"><h2 id="dialogTitle"></h2><button id="closeDialog">×</button></div><div id="dialogBody"></div></dialog>
<script src="renderer.js"></script></body></html>
